repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        exclude: ^tests/fixtures/
      - id: trailing-whitespace
        exclude: ^(tests/fixtures/|src/.*/snapshots/)
      - id: end-of-file-fixer
        exclude: ^(tests/fixtures/|src/.*/snapshots/|schemas/)

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.9.1
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
