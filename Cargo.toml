[package]
name = "odcslint"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
description = "A fast linter and fixer for Open Data Contract Standard (ODCS) contracts"
license = "MIT"
repository = "https://github.com/feliblo/odcslint"
homepage = "https://github.com/feliblo/odcslint"
readme = "README.md"
keywords = ["odcs", "data-contract", "linter", "yaml", "json-schema"]
categories = ["command-line-utilities", "development-tools"]
authors = ["feliblo"]
include = ["src/**", "schemas/**", "licenses/**", "README.md", "LICENSE"]

[[bin]]
name = "odcslint"
path = "src/main.rs"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
multiple_crate_versions = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[lints.rust]
unsafe_code = "forbid"
unused_imports = "deny"
warnings = "deny"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
globset = "0.4.20"
ignore = "0.4.33"
jsonschema = { version = "0.59.0", default-features = false }
log = "0.4.34"
owo-colors = "4.4.0"
rayon = "1.12.0"
regex = "1.13.1"
remain = "0.2.16"
saphyr = { version = "~0.2.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.8"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.49.0"
predicates = "3.1.4"
tempfile = "3.27.0"

[profile.release]
debug = 0
strip = true

[profile.minimal-size]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dist]
inherits = "minimal-size"
